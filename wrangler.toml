name = "nesh-worker"
main = "src/index.js"
type = "service-worker"
compatibility_date = "2024-01-01"

[env.production]
name = "nesh-worker-prod"
routes = []

[build]
cwd = "."
command = ""

[env.production.vars]
FIREBASE_DB_URL = "YOUR_FIREBASE_DB_URL"
FIREBASE_SERVICE_ACCOUNT_JSON = "YOUR_FIREBASE_SERVICE_ACCOUNT_JSON"

[[triggers.crons]]
crons = ["* * * * *"]
